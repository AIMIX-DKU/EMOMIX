<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EmoMix · 나만의 이모티콘</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <div id="emomix-full">
      <header>
        <button class="brand" data-go="studio" aria-label="EmoMix 만들기 홈">
          <span class="logo" aria-hidden="true"></span><b>EmoMix</b
          ><small>by AIMIX</small>
        </button>
        <nav aria-label="서비스">
          <button data-go="studio">만들기</button
          ><button data-go="library">보관함</button
          ><button data-go="community">커뮤니티</button
          ><button data-go="market">마켓</button>
        </nav>
        <div class="account">
          <button data-go="notifications" aria-label="알림" class="bell" data-need="user" hidden>
            <i data-lucide="bell" aria-hidden="true"></i
            ><span class="unread" data-account="unread" hidden></span></button
          ><button class="credit" data-go="wallet" data-account="credit" aria-label="지갑·크레딧 충전" hidden></button
          ><button class="who" data-go="profile" data-account="who" aria-label="내 정보·설정" hidden>
            <span class="avatar" aria-hidden="true"></span><span class="who-name"></span></button
          ><button data-auth-tab="로그인">로그인</button
          ><button data-auth-tab="회원가입" class="primary">회원가입</button>
        </div>
      </header>
      <div class="shell">
        <aside hidden>
          <p>내 작업 공간</p>
          <button data-go="library" data-need="user">
            <i data-lucide="folder-heart" aria-hidden="true"></i>내 보관함</button
          ><button data-go="jobs" data-need="user">
            <i data-lucide="clock-3" aria-hidden="true"></i>생성 내역</button
          ><button data-go="wallet" data-need="user">
            <i data-lucide="wallet" aria-hidden="true"></i>지갑·충전</button
          ><button data-go="orders" data-need="user">
            <i data-lucide="shopping-bag" aria-hidden="true"></i>구매·후원
          </button>
          <p>계정과 운영</p>
          <button data-go="subscription" data-need="user">구독 관리</button
          ><button data-go="profile" data-need="user">내 정보·설정</button
          ><button data-go="creator" data-need="user">창작자 센터</button
          ><button data-go="admin" data-need="admin" hidden>관리자</button>
        </aside>
        <main id="mix-content" aria-label="EmoMix 화면"></main>
      </div>
      <div class="toasts" role="status" aria-live="polite"></div>
      <section
        class="overlay"
        role="dialog"
        aria-modal="true"
        aria-labelledby="mix-modal-title"
        hidden
      >
        <div class="modal">
          <div class="modal-head">
            <h2 id="mix-modal-title"></h2>
            <button data-close aria-label="닫기">×</button>
          </div>
          <div class="modal-body"></div>
        </div>
      </section>
      <nav class="tabbar" aria-label="주요 메뉴">
        <button data-go="studio"><i data-lucide="sparkles" aria-hidden="true"></i><span>만들기</span></button
        ><button data-go="library"><i data-lucide="folder-heart" aria-hidden="true"></i><span>보관함</span></button
        ><button data-go="community"><i data-lucide="users" aria-hidden="true"></i><span>커뮤니티</span></button
        ><button data-go="market"><i data-lucide="shopping-bag" aria-hidden="true"></i><span>마켓</span></button
        ><button data-go="profile"><i data-lucide="user" aria-hidden="true"></i><span>내 정보</span></button>
      </nav>
      <footer>
        <b>EmoMix</b><span>by AIMIX</span>
        <div class="foot-links"><button data-go="terms">이용약관</button
        ><button data-go="terms">개인정보 처리방침</button></div>
        <span class="copy">© 2026 AIMIX. 인공지능융합플랫폼 팀 프로젝트</span>
      </footer>
    </div>
  </body>
</html>
